<!DOCTYPE html>
<html>

  <head>
    
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <meta http-equiv="refresh" content="0; url={{ page.redirect | prepend: site.baseurl }}">

    <title>VisualVM: {{ page.title }}</title>

    <link rel="canonical" href="{{ page.redirect | prepend: site.baseurl }}"/>
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Open+Sans:regular,bold">
    <link rel="stylesheet" type="text/css" href="{{ '/css/visualvm_base.css' | prepend: site.baseurl }}">

  </head>

  <body>
      
    {% include visualvm_base_header.html %}
    
    <div class="content_wrapper">
        <div class="content_main">
            <div class="centered_content" style="padding-top: 200px; padding-bottom: 500px;">

                <p>This page has moved to <a href="{{ page.redirect | prepend: site.baseurl }}">{{ page.title }}</a>.</p>
                <script>location.replace({{ page.redirect | prepend: site.baseurl | jsonify }} + location.search + location.hash);</script>

            </div>
        </div>
    </div>

    {% include visualvm_base_footer.html %}

  </body>

</html>
